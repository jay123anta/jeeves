name: Feature request
description: Something the package should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried instead
      description: Schema descriptions, system_instructions, a different query_mode?
